name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black ruff pytest
    
    - name: Run black
      run: black --check .
    
    - name: Run ruff
      run: ruff check .
    
    - name: Run pytest
      run: pytest tests/ -v

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      run: pytest tests/ -v --tb=short
    
    - name: Test imports
      run: |
        python -c "import src.utils; print('Utils imported successfully')"
        python -c "import src.data; print('Data imported successfully')"
        python -c "import src.models; print('Models imported successfully')"
        python -c "import src.eval; print('Eval imported successfully')"
        python -c "import src.viz; print('Viz imported successfully')"
