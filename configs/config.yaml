# Model Configuration
model:
  text_to_image:
    name: "CompVis/stable-diffusion-v-1-4-original"
    num_inference_steps: 50
    guidance_scale: 7.5
    height: 512
    width: 512
  
  image_to_text:
    name: "Salesforce/blip-image-captioning-base"
    max_length: 77
    num_beams: 5
    early_stopping: true
  
  clip:
    name: "openai/clip-vit-base-patch32"
    available: true

# Training Configuration
training:
  batch_size: 8
  num_epochs: 10
  learning_rate: 1e-4
  weight_decay: 1e-5
  warmup_steps: 100
  max_grad_norm: 1.0
  
  # Loss weights
  contrastive_weight: 1.0
  reconstruction_weight: 1.0
  temperature: 0.07
  
  # Mixed precision
  use_amp: true
  
  # Checkpointing
  save_every: 1000
  eval_every: 500

# Data Configuration
data:
  data_dir: "data"
  image_size: 512
  max_text_length: 77
  num_workers: 4
  
  # Data augmentation
  augmentation:
    horizontal_flip: 0.5
    color_jitter: 0.1
    rotation: 10

# Evaluation Configuration
evaluation:
  metrics:
    - "bleu"
    - "rouge1"
    - "rouge2"
    - "rougeL"
    - "bert_f1"
    - "clip_score"
    - "distinct_1"
    - "distinct_2"
  
  # Evaluation settings
  num_samples: 100
  save_predictions: true
  save_visualizations: true

# Device Configuration
device:
  type: "auto"  # auto, cuda, mps, cpu
  precision: "fp16"  # fp16, fp32, bf16
  
# Logging Configuration
logging:
  level: "INFO"
  log_dir: "logs"
  tensorboard: true
  wandb:
    enabled: false
    project: "cross-modal-translation"
    entity: null

# Demo Configuration
demo:
  framework: "streamlit"  # streamlit, gradio
  port: 8501
  host: "0.0.0.0"
  
  # Safety settings
  safety_checker: true
  content_filter: true
  max_prompt_length: 200
  
  # Generation settings
  default_steps: 50
  default_guidance: 7.5
  max_images_per_request: 4

# Paths
paths:
  data_dir: "data"
  output_dir: "outputs"
  assets_dir: "assets"
  checkpoints_dir: "checkpoints"
  logs_dir: "logs"
